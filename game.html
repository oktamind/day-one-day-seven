<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Dash: Coin Run — Day 1 vs Day 7</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<script>
// Ghost Dash: Coin Run — a tiny agent-built game.
// Same map, same start, same seeded run every time. ?day=1 is the bare
// first-day build; ?day=7 is the same game after a week of daily updates:
// more going on, same camera, same ghost, same starting spot.
// Deterministic: seeded RNG + scripted ghost path, so Day 1 and Day 7
// show identical moments side by side.
const params = new URLSearchParams(location.search);
const DAY = params.get('day') === '7' ? 7 : 1;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const GROUND_Y = 1620;

// Seeded RNG (mulberry32) — identical spawn schedule on both days.
let seed = 20261123;
function rnd() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// Scripted ghost path: chases the coins, same on both days.
function ghostX(t) {
  return 540 + 340 * Math.sin(t * 0.9) + 120 * Math.sin(t * 2.3 + 1.7);
}

// Spawn schedule, fixed by the seed. Day 7 adds gems/stars on top.
const spawns = [];
for (let i = 0; i < 26; i++) {
  spawns.push({
    kind: 'coin', x: 120 + rnd() * 840, y: -60 - i * 170,
    vy: 520 + rnd() * 120, r: 42, born: i * 0.32
  });
}
const meteors = [];
for (let i = 0; i < (DAY === 7 ? 14 : 5); i++) {
  meteors.push({
    x: 100 + rnd() * 880, y: -80 - i * 420,
    vy: 640 + rnd() * 220, r: DAY === 7 ? 46 + rnd() * 26 : 52,
    spin: rnd() * 6.28, vspin: (rnd() - 0.5) * 3,
    kind: DAY === 7 ? ['rock', 'fire', 'ice'][i % 3] : 'rock'
  });
}
const extras = []; // Day 7 only: gems + stars between the coins.
if (DAY === 7) {
  for (let i = 0; i < 16; i++) {
    extras.push({
      kind: i % 2 ? 'gem' : 'star', x: 140 + rnd() * 800, y: -140 - i * 260,
      vy: 560 + rnd() * 140, r: 36, born: 0.3 + i * 0.45, phase: rnd() * 6.28
    });
  }
}
const clouds = [];
if (DAY === 7) {
  for (let i = 0; i < 5; i++) clouds.push({ x: rnd() * 1080, y: 520 + rnd() * 260, s: 0.5 + rnd() * 0.5, v: 12 + rnd() * 18 });
}
const particles = [];
const popups = [];
let score = 0, combo = 0, collected = 0, hearts = 3;
let startT = null;
window.__shotReady = false;

function drawGhost(x, y, t) {
  const bob = Math.sin(t * 6) * 8;
  ctx.save();
  ctx.translate(x, y + bob);
  // trail (Day 7 only)
  if (DAY === 7) {
    for (let i = 1; i <= 4; i++) {
      ctx.globalAlpha = 0.16 - i * 0.03;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-i * 26, 10 + i * 6, 52 - i * 6, 0, 6.29);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // body
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 58, Math.PI, 0);
  ctx.lineTo(58, 42);
  for (let i = 0; i < 3; i++) {
    ctx.arc(58 - 19 - i * 38, 42, 19, 0, Math.PI);
  }
  ctx.lineTo(-58, 0);
  ctx.fill();
  // eyes + smile
  ctx.fillStyle = '#191419';
  ctx.beginPath(); ctx.arc(-20, -8, 11, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -8, 11, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 16, 14, 0.15 * Math.PI, 0.85 * Math.PI); ctx.fill();
  ctx.restore();
}

function frame(now) {
  if (startT === null) startT = now;
  const t = (now - startT) / 1000;
  // --- sky ---
  if (DAY === 1) {
    ctx.fillStyle = '#8a97a8'; ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2b1055'); g.addColorStop(0.45, '#7597de');
    g.addColorStop(0.75, '#ff9a5a'); g.addColorStop(1, '#ffd194');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sun — kept clear of the HUD (top-right, below the combo row)
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(860, 430, 84, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,243,176,0.25)';
    ctx.beginPath(); ctx.arc(860, 430, 130, 0, 6.29); ctx.fill();
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) {
      const cx = ((c.x + t * c.v) % 1300) - 110;
      ctx.beginPath();
      ctx.ellipse(cx, c.y, 130 * c.s, 42 * c.s, 0, 0, 6.29);
      ctx.ellipse(cx + 90 * c.s, c.y + 14, 90 * c.s, 34 * c.s, 0, 0, 6.29);
      ctx.fill();
    }
    // stars in the upper sky
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 24; i++) {
      const sx = (i * 173) % 1080, sy = 40 + (i * 97) % 260;
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + i));
      ctx.fillRect(sx, sy, 6, 6);
    }
    ctx.globalAlpha = 1;
  }
  // --- ground (same map both days) ---
  ctx.fillStyle = DAY === 1 ? '#5b6470' : '#3d7a4a';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = DAY === 1 ? '#6e7887' : '#57a05e';
  ctx.fillRect(0, GROUND_Y, W, 26);
  if (DAY === 7) {
    // grass tufts + flowers, same spots every run
    ctx.fillStyle = '#2f6b3a';
    for (let i = 0; i < 18; i++) {
      const gx = (i * 197) % 1080;
      ctx.fillRect(gx, GROUND_Y + 60 + (i % 5) * 40, 8, 34);
    }
    ctx.fillStyle = '#ff6fb5';
    for (let i = 0; i < 8; i++) {
      const fx = (i * 263 + 80) % 1080;
      ctx.beginPath(); ctx.arc(fx, GROUND_Y + 120 + (i % 4) * 50, 12, 0, 6.29); ctx.fill();
    }
  }
  // --- coins ---
  const gx = ghostX(t);
  for (const s of spawns) {
    if (t < s.born) continue;
    const y = s.y + (t - s.born) * s.vy;
    if (y > H + 80) continue;
    const spin = Math.abs(Math.sin(t * 3 + s.x));
    ctx.save();
    ctx.translate(s.x, y);
    ctx.scale(0.35 + 0.65 * spin, 1);
    ctx.fillStyle = '#ffd23e';
    ctx.beginPath(); ctx.arc(0, 0, s.r, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#b8860b';
    ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 2);
    ctx.restore();
    if (Math.abs(s.x - gx) < 80 && Math.abs(y - 1500) < 90 && !s.taken) {
      s.taken = true; collected++; score += 10; combo++;
      if (DAY === 7) {
        popups.push({ x: s.x, y: y - 40, txt: '+10', life: 1 });
        for (let p = 0; p < 10; p++) particles.push({ x: s.x, y, vx: (rnd() - 0.5) * 400, vy: -rnd() * 300, life: 0.7, c: '#ffd23e' });
      }
    }
  }
  // --- Day 7 extras: gems + stars ---
  if (DAY === 7) {
    for (const e of extras) {
      if (t < e.born) continue;
      const y = e.y + (t - e.born) * e.vy;
      if (y > H + 80) continue;
      const tw = 0.7 + 0.3 * Math.sin(t * 4 + e.phase);
      ctx.save(); ctx.translate(e.x, y); ctx.rotate(Math.sin(t * 2 + e.phase) * 0.3);
      if (e.kind === 'gem') {
        ctx.fillStyle = '#ff6fb5';
        ctx.beginPath();
        ctx.moveTo(0, -e.r); ctx.lineTo(e.r * tw, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r * tw, 0);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = '#7ef0ff';
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + k * 1.2566;
          ctx.lineTo(Math.cos(a) * e.r * tw, Math.sin(a) * e.r * tw);
          const a2 = a + 0.6283;
          ctx.lineTo(Math.cos(a2) * e.r * 0.45, Math.sin(a2) * e.r * 0.45);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      if (Math.abs(e.x - gx) < 80 && Math.abs(y - 1500) < 90 && !e.taken) {
        e.taken = true; collected++; score += 25; combo++;
        popups.push({ x: e.x, y: y - 40, txt: '+25', life: 1 });
        for (let p = 0; p < 12; p++) particles.push({ x: e.x, y, vx: (rnd() - 0.5) * 420, vy: -rnd() * 320, life: 0.7, c: e.kind === 'gem' ? '#ff6fb5' : '#7ef0ff' });
      }
    }
  }
  // --- meteors ---
  for (const m of meteors) {
    const y = m.y + t * m.vy;
    if (y > H + 100) continue;
    ctx.save();
    ctx.translate(m.x, y);
    ctx.rotate(m.spin + t * m.vspin);
    ctx.fillStyle = m.kind === 'fire' ? '#ff5a3c' : m.kind === 'ice' ? '#7ef0ff' : '#7a828e';
    ctx.beginPath();
    for (let k = 0; k < 7; k++) {
      const a = k * 0.8976;
      const rr = m.r * (k % 2 ? 0.75 : 1);
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    if (Math.abs(m.x - gx) < 90 && Math.abs(y - 1500) < 100 && !m.hit) {
      m.hit = true; hearts = Math.max(0, hearts - 1); combo = 0;
      if (DAY === 7) popups.push({ x: m.x, y: y - 40, txt: 'OUCH!', life: 1 });
    }
  }
  // --- particles + popups (Day 7) ---
  if (DAY === 7) {
    for (const p of particles) {
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += 500 * 0.016; p.life -= 0.016;
      if (p.life > 0) { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 10, 10); }
    }
    ctx.globalAlpha = 1;
    ctx.font = 'bold 52px sans-serif'; ctx.textAlign = 'center';
    for (const pp of popups) {
      pp.life -= 0.016; pp.y -= 1.2;
      if (pp.life > 0) { ctx.globalAlpha = pp.life; ctx.fillStyle = '#ffffff'; ctx.fillText(pp.txt, pp.x, pp.y); }
    }
    ctx.globalAlpha = 1;
  }
  // --- ghost ---
  drawGhost(gx, 1500, t);
  // --- HUD ---
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(36, 36, 560, 150);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 64px sans-serif';
  ctx.fillText('SCORE ' + score, 60, 110);
  ctx.font = 'bold 44px sans-serif';
  ctx.fillText('DAY ' + DAY + '  •  ' + collected + ' collected', 60, 165);
  if (DAY === 7) {
    ctx.fillStyle = '#ffd23e';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('COMBO x' + Math.max(1, combo), 700, 110);
    ctx.fillStyle = '#ff6fb5';
    ctx.font = 'bold 56px sans-serif';
    ctx.fillText('♥'.repeat(hearts) + '♡'.repeat(3 - hearts), 700, 170);
    // progress bar: a week of updates
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(36, 210, 560, 26);
    ctx.fillStyle = '#7ef0ff'; ctx.fillRect(36, 210, 560 * Math.min(1, t / 12), 26);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px sans-serif';
    ctx.fillText('WEEK OF UPDATES', 36, 290);
  }
  if (t > 0.2) window.__shotReady = true;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
